name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check examples/

      - name: Ruff format check
        run: uv run ruff format --check examples/

      - name: Byte-compile examples
        run: uv run python -m compileall -q examples/

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TypeScript example dependencies
        working-directory: examples/ts
        run: npm ci

      - name: Typecheck
        working-directory: examples/ts
        run: npx tsc --noEmit
